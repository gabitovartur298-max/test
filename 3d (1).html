      const SHAPES = {
        normal: { bx: 1, by: 0.42, bz: 0.24, taper: 0.55, tail: "fork", dorsal: "tri" },
        long: { bx: 1.35, by: 0.2, bz: 0.17, taper: 0.5, tail: "thin", dorsal: "long" },
        round: { bx: 0.75, by: 0.62, bz: 0.55, taper: 0.35, tail: "round", dorsal: "tri" },
        tall: { bx: 0.75, by: 0.66, bz: 0.16, taper: 0.5, tail: "fork", dorsal: "tall", ventral: true },
        shark: { bx: 1.3, by: 0.34, bz: 0.3, taper: 0.65, tail: "crescent", dorsal: "shark" },
        ray: { bx: 0.8, by: 0.12, bz: 0.95, taper: 0.4, tail: "whip", dorsal: "none" },
        sword: { bx: 1.15, by: 0.36, bz: 0.24, taper: 0.6, tail: "crescent", dorsal: "shark" },
      };

      function mutColors(def, mut) {
        const base = { body: def.body, belly: def.belly, fin: def.fin, accent: def.accent ?? shade(def.fin, -0.15) };
        switch (mut) {
          case "albino": return { body: "#f6f2f0", belly: "#ffffff", fin: "#ffc8d0", accent: "#ffe0e6" };
          case "golden": return { body: "#ffcf33", belly: "#fff0a0", fin: "#ffb300", accent: "#ffe680" };
          case "galaxy": return { body: "#2a1a6a", belly: "#6a3aff", fin: "#ff6aff", accent: "#ffffff" };
          case "ghost": {
            const g = (h0) => "#" + new THREE.Color(h0).lerp(new THREE.Color("#a6f4ff"), 0.6).getHexString();
            return { body: g(base.body), belly: g(base.belly), fin: g(base.fin), accent: g(base.accent) };
          }
          case "rainbow": return { body: "#ffffff", belly: "#f0f0f0", fin: "#ffffff", accent: "#dddddd" };
          case "crystal": return { body: "#9fe8ff", belly: "#eafaff", fin: "#c6b0ff", accent: "#ffffff" };
          case "solar": return { body: "#ffb02e", belly: "#fff2a0", fin: "#ff6a1a", accent: "#fff6d0" };
          case "void": return { body: "#1a0a2a", belly: "#3a1a5a", fin: "#8a2aff", accent: "#c66aff" };
          default: return base;
        }
      }

      function tailShape(kind) {
        const s = new THREE.Shape();
        switch (kind) {
          case "fork":
            s.moveTo(0.06, 0); s.lineTo(-0.45, 0.4); s.lineTo(-0.32, 0); s.lineTo(-0.45, -0.4); s.lineTo(0.06, 0);
            break;
          case "round":
            s.moveTo(0.04, 0); s.quadraticCurveTo(-0.5, 0.5, -0.46, 0); s.quadraticCurveTo(-0.5, -0.5, 0.04, 0);
            break;
          case "crescent":
            s.moveTo(0.06, 0.05); s.quadraticCurveTo(-0.2, 0.22, -0.42, 0.58); s.quadraticCurveTo(-0.3, 0.12, -0.27, 0);
            s.quadraticCurveTo(-0.3, -0.12, -0.38, -0.4); s.quadraticCurveTo(-0.18, -0.15, 0.06, -0.05);
            break;
          case "thin":
            s.moveTo(0.06, 0.07); s.lineTo(-0.62, 0); s.lineTo(0.06, -0.07);
            break;
          case "whip":
            s.moveTo(0.05, 0.03); s.lineTo(-1.3, 0); s.lineTo(0.05, -0.03);
            break;
        }
        return s;
      }

      function dorsalShape(kind) {
        const s = new THREE.Shape();
        switch (kind) {
          case "tri": s.moveTo(-0.38, 0); s.lineTo(0.22, 0); s.lineTo(-0.22, 0.32); break;
          case "long": s.moveTo(-1.15, 0); s.lineTo(0.75, 0); s.lineTo(0.6, 0.11); s.lineTo(-1.05, 0.13); break;
          case "tall": s.moveTo(-0.45, 0); s.lineTo(0.25, 0); s.lineTo(-0.38, 0.62); break;
          case "shark": s.moveTo(-0.26, 0); s.lineTo(0.26, 0); s.quadraticCurveTo(0.02, 0.22, -0.22, 0.48); break;
          case "none": return null;
        }
        return s;
      }

      function bodyVertexColors(geo, cols, def, mut) {
        const pos = geo.attributes.position;
        const cBody = new THREE.Color(cols.body);
        const cBelly = new THREE.Color(cols.belly);
        const cAcc = new THREE.Color(cols.accent);
        const out = new Float32Array(pos.count * 3);
        const c = new THREE.Color();
        const pattern = mut === "galaxy" ? "spots" : def.pattern;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          c.copy(cBelly).lerp(cBody, smoothstep(-0.35, 0.25, y));
          if (pattern === "stripes" && Math.sin(x * 11 + 1) > 0.55 && y > -0.35) c.lerp(cAcc, 0.8);
          if (pattern === "spots") {
            const h0 = Math.abs(Math.sin(Math.round(x * 6) * 12.9898 + Math.round(y * 6) * 78.233 + Math.round(z * 6) * 37.719) * 43758.5453) % 1;
            if (h0 > 0.8 && y > -0.4) c.lerp(cAcc, 0.85);
          }
          out[i * 3] = c.r;
          out[i * 3 + 1] = c.g;
          out[i * 3 + 2] = c.b;
        }
        geo.setAttribute("color", new THREE.BufferAttribute(out, 3));
      }

      export function createFishMesh(def, mut, length) {
        const g = new THREE.Group();
        const cols = mutColors(def, mut);
        const emissive = new THREE.Color(0x000000);
        let ei = 0;
        if (def.glow) {
          emissive.set(cols.fin);
          ei = 0.45;
        }
        const phong = { vertexColors: true, flatShading: true, shininess: 50, specular: new THREE.Color("#333333") };
        if (mut === "golden") {
          phong.specular = new THREE.Color("#ffe9a0");
          phong.shininess = 90;
          emissive.set("#6a4a00");
          ei = 0.45;
        } else if (mut === "shiny") {
          emissive.set(cols.body);
          ei = 0.4;
        } else if (mut === "ghost") {
          phong.transparent = true;
          phong.opacity = 0.55;
          phong.depthWrite = false;
          emissive.set("#60d0ff");
          ei = 0.4;
        } else if (mut === "galaxy") {
          emissive.set("#4a1aa0");
          ei = 0.55;
        }
        const bodyMat = new THREE.MeshPhongMaterial({ ...phong, emissive, emissiveIntensity: ei });
        const finMat = new THREE.MeshPhongMaterial({
          color: cols.fin, flatShading: true, side: THREE.DoubleSide, emissive, emissiveIntensity: ei,
          transparent: !!phong.transparent, opacity: phong.opacity ?? 1, depthWrite: !phong.transparent,
        });
        const eyeWhite = mat("#ffffff");
        const pupil = mat(mut === "albino" ? "#e0263a" : "#111111");
        const tail = new THREE.Group();
        let matsOut = null;

        if (def.shape === "jelly") {
          const bellGeo = new THREE.SphereGeometry(0.62, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.62);
          bellGeo.scale(1, 0.95, 1);
          bellGeo.rotateZ(-Math.PI / 2);
          bodyVertexColors(bellGeo, cols, def, mut);
          const bellMat = new THREE.MeshPhongMaterial({
            ...phong, emissive, emissiveIntensity: Math.max(ei, 0.3), side: THREE.DoubleSide,
            transparent: true, opacity: mut === "ghost" ? 0.4 : 0.72, depthWrite: false,
          });
          g.add(mesh(bellGeo, bellMat, 0.25, 0, 0));
          const rimGeo = new THREE.TorusGeometry(0.6, 0.055, 5, 18);
          rimGeo.rotateY(Math.PI / 2);
          g.add(mesh(rimGeo, finMat, 0.25, 0, 0, false));
          for (const s of [-1, 1]) {
            g.add(mesh(new THREE.SphereGeometry(0.075, 7, 5), eyeWhite, 0.5, 0.02, 0.22 * s, false));
            g.add(mesh(new THREE.SphereGeometry(0.042, 6, 5), pupil, 0.55, 0.02, 0.26 * s, false));
          }
          tail.position.x = 0.2;
          for (let i = 0; i < 9; i++) {
            const a = (i / 9) * Math.PI * 2;
            const len = 0.75 + (i % 3) * 0.3;
            const tg = new THREE.CylinderGeometry(0.022, 0.045, len, 5);
            tg.rotateZ(Math.PI / 2);
            tg.translate(-len / 2, 0, 0);
            const tm = mesh(tg, finMat, 0, Math.sin(a) * 0.34, Math.cos(a) * 0.34);
            tm.rotation.y = Math.cos(a) * 0.18;
            tm.rotation.z = Math.sin(a) * 0.18;
            tail.add(tm);
          }
          g.add(tail);
          bodyMat.dispose();
          matsOut = [bellMat, finMat];
        } else if (def.shape === "squid") {
          const mantleGeo = new THREE.ConeGeometry(0.36, 1.3, 8, 3);
          mantleGeo.rotateZ(-Math.PI / 2);
          bodyVertexColors(mantleGeo, cols, def, mut);
          g.add(mesh(mantleGeo, bodyMat, 0.45, 0, 0));
          const headGeo = new THREE.SphereGeometry(0.32, 10, 8);
          bodyVertexColors(headGeo, cols, def, mut);
          g.add(mesh(headGeo, bodyMat, -0.35, 0, 0));
          for (const s of [-1, 1]) {
            g.add(mesh(new THREE.SphereGeometry(0.09, 8, 6), eyeWhite, -0.3, 0.08, 0.27 * s, false));
            g.add(mesh(new THREE.SphereGeometry(0.05, 6, 5), pupil, -0.27, 0.08, 0.34 * s, false));
          }
          const finGeo = new THREE.ShapeGeometry(tailShape("round"));
          const fin = mesh(finGeo, finMat, 1.05, 0, 0);
          fin.rotation.y = Math.PI;
          fin.rotation.x = Math.PI / 2;
          g.add(fin);
          tail.position.x = -0.55;
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            const tg = new THREE.ConeGeometry(0.05, 1.0, 5);
            tg.rotateZ(Math.PI / 2);
            const tm = mesh(tg, finMat, -0.5, Math.sin(a) * 0.14, Math.cos(a) * 0.14);
            tm.rotation.y = Math.cos(a) * 0.25;
            tm.rotation.z = Math.sin(a) * 0.25;
            tail.add(tm);
          }
          g.add(tail);
        } else {
          const cfg = SHAPES[def.shape];
          const geo = new THREE.SphereGeometry(1, 14, 10);
          const pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            let y = pos.getY(i);
            let z = pos.getZ(i);
            const k = x < 0 ? 1 - cfg.taper * Math.pow(-x, 1.3) : 1 - 0.2 * x * x;
            y *= k;
            z *= k;
            pos.setXYZ(i, x * cfg.bx, y * cfg.by, z * cfg.bz);
          }
          geo.computeVertexNormals();
          bodyVertexColors(geo, cols, def, mut);
          g.add(mesh(geo, bodyMat));

          tail.position.x = -cfg.bx * 0.9;
          const tScale = def.shape === "ray" ? 1 : Math.max(0.32, cfg.by) * 1.45;
          const tGeo = new THREE.ShapeGeometry(tailShape(cfg.tail));
          const tm = mesh(tGeo, finMat);
          tm.scale.setScalar(tScale);
          tail.add(tm);
          g.add(tail);

          const ds = dorsalShape(cfg.dorsal);
          if (ds) {
            const dm = mesh(new THREE.ShapeGeometry(ds), finMat, def.shape === "shark" || def.shape === "sword" ? 0.1 : 0, cfg.by * 0.86, 0);
            dm.scale.setScalar(def.shape === "long" ? 1 : Math.max(0.6, cfg.by * 1.9));
            g.add(dm);
            if (cfg.ventral) {
              const vm = dm.clone();
              vm.position.y = -cfg.by * 0.86;
              vm.scale.y *= -0.8;
              g.add(vm);
            }
          }
          if (def.shape !== "ray") {
            const ps = new THREE.Shape();
            ps.moveTo(0, 0); ps.lineTo(-0.3, 0.1); ps.lineTo(-0.24, -0.13);
            const pg = new THREE.ShapeGeometry(ps);
            for (const s of [-1, 1]) {
              const pm = mesh(pg, finMat, cfg.bx * 0.35, -cfg.by * 0.3, cfg.bz * 0.82 * s);
              pm.rotation.y = 0.6 * s;
              pm.scale.setScalar(Math.max(0.7, cfg.by * 2));
              g.add(pm);
            }
          }
          if (def.shape === "sword") {
            const ng = new THREE.ConeGeometry(0.035, 1.0, 6);
            ng.rotateZ(-Math.PI / 2);
            g.add(mesh(ng, bodyMat, cfg.bx + 0.45, 0.02, 0));
          }
          const eyeR = Math.min(0.13, Math.max(0.06, cfg.by * 0.22));
          const ex = cfg.bx * 0.62;
          const ey = def.shape === "ray" ? cfg.by * 0.7 : cfg.by * 0.22;
          const ez = def.shape === "ray" ? cfg.bz * 0.25 : cfg.bz * 0.62;
          for (const s of [-1, 1]) {
            g.add(mesh(new THREE.SphereGeometry(eyeR, 8, 6), eyeWhite, ex, ey, ez * s, false));
            g.add(mesh(new THREE.SphereGeometry(eyeR * 0.55, 6, 5), pupil, ex + eyeR * 0.25, ey, (ez + eyeR * 0.6) * s, false));
          }
        }

        const box = new THREE.Box3().setFromObject(g);
        const size = box.max.x - box.min.x;
        const k = length / Math.max(0.01, size);
        g.scale.setScalar(k);
        g.traverse((c) => {
          if (c.isMesh) c.castShadow = true;
        });
        const sparkleMuts = ["shiny", "galaxy", "rainbow", "golden", "crystal", "solar", "void"];
        g.userData = {
          tail,
          mats: matsOut ?? [bodyMat, finMat],
          rainbow: mut === "rainbow",
          sparkle: !!mut && sparkleMuts.includes(mut),
        };
        return g;
      }

      export function disposeFish(g) {
        const d = g.userData;
        d?.mats?.forEach((m) => m.dispose());
        g.traverse((c) => {
          if (c.isMesh) c.geometry.dispose();
        });
      }

      export const WALK_R = 16.2;
      export const PIER = { x0: 12.2, x1: 31, hw: 1.45, y: 0.95 };
      export const SPAWN = { x: 8.5, z: 0, heading: Math.PI / 2 };

      export function terrainHeight(r) {
        if (r < 13) return 1.2;
        if (r < 14.73) return 1.2 - ((r - 13) / 1.73) * 0.8;
        return 0.4;
      }
      export const onPier = (x, z, pad = 0) => x >= PIER.x0 - pad && x <= PIER.x1 + pad && Math.abs(z) <= PIER.hw + pad;
      export function groundHeight(x, z) {
        const r = Math.hypot(x, z);
        let h0 = terrainHeight(Math.min(r, WALK_R + 1));
        if (onPier(x, z)) h0 = Math.max(h0, PIER.y);
        return h0;
      }
      export const isWalkable = (x, z) => Math.hypot(x, z) <= WALK_R || onPier(x, z);
      export const isWater = (x, z) => Math.hypot(x, z) > 18.3 && !onPier(x, z, 0.6);

      function palm(th, r) {
        const g = new THREE.Group();
        const lean = 0.12 + r() * 0.12;
        let x = 0, y = 0;
        for (let i = 0; i < 6; i++) {
          const seg = mesh(new THREE.CylinderGeometry(0.17 - i * 0.01, 0.21 - i * 0.01, 0.78, 7), mat(i % 2 ? th.wood : shade(th.wood, 0.06)), x, y + 0.39, 0);
          seg.rotation.z = -lean * (i / 5);
          g.add(seg);
          x += Math.sin(lean * (i / 5)) * 0.78;
          y += Math.cos(lean * (i / 5)) * 0.74;
        }
        const leafGeo = new THREE.BoxGeometry(0.75, 0.05, 2.6, 1, 1, 6);
        const lp = leafGeo.attributes.position;
        for (let i = 0; i < lp.count; i++) {
          const z = lp.getZ(i) + 1.3;
          lp.setZ(i, z);
          lp.setY(i, lp.getY(i) - z * z * 0.13);
          lp.setX(i, lp.getX(i) * (1 - (z / 2.6) * 0.7));
        }
        leafGeo.computeVertexNormals();
        const n = 7;
        for (let i = 0; i < n; i++) {
          const leaf = mesh(leafGeo, mat(i % 2 ? th.leaf : th.leaf2), x, y + 0.05, 0);
          leaf.rotation.order = "YXZ";
          leaf.rotation.y = (i / n) * Math.PI * 2 + r() * 0.3;
          leaf.rotation.x = -0.15 + r() * 0.2;
          g.add(leaf);
        }
        for (let i = 0; i < 3; i++) g.add(mesh(new THREE.SphereGeometry(0.16, 6, 5), mat("#6a4a2a"), x + Math.cos(i * 2.1) * 0.22, y - 0.15, Math.sin(i * 2.1) * 0.22));
        return g;
      }

      function pine(th, snow, r) {
        const g = new THREE.Group();
        const s = 0.85 + r() * 0.5;
        g.add(mesh(new THREE.CylinderGeometry(0.16, 0.22, 1.2, 6), mat(th.wood), 0, 0.6, 0));
        for (let i = 0; i < 3; i++) {
          const rad = (1.5 - i * 0.38) * s;
          const yy = 1.2 + i * 1.0 * s;
          g.add(mesh(jitter(new THREE.ConeGeometry(rad, 1.6 * s, 8), 0.06, i + 3), mat(i % 2 ? th.leaf : th.leaf2), 0, yy + 0.5 * s, 0));
          if (snow) g.add(mesh(new THREE.ConeGeometry(rad * 0.55, 0.6 * s, 8), mat("#ffffff"), 0, yy + 1.05 * s, 0));
        }
        return g;
      }

      function blossom(th, r) {
        const g = new THREE.Group();
        const s = 0.85 + r() * 0.45;
        g.add(mesh(new THREE.CylinderGeometry(0.14 * s, 0.24 * s, 2.3 * s, 6), mat(th.wood), 0, 1.15 * s, 0));
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * Math.PI * 2 + r();
          const br = mesh(new THREE.CylinderGeometry(0.07 * s, 0.11 * s, 1.3 * s, 5), mat(th.wood), Math.cos(a) * 0.4 * s, 2.0 * s, Math.sin(a) * 0.4 * s);
          br.rotation.z = -Math.cos(a) * 0.6;
          br.rotation.x = Math.sin(a) * 0.6;
          g.add(br);
        }
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + r() * 0.5;
          const rad = (0.6 + r() * 0.7) * s;
          const col = i % 2 ? th.leaf : th.leaf2;
          g.add(mesh(new THREE.IcosahedronGeometry(rad, 0), mat(col, { emissive: col, ei: 0.3 }), Math.cos(a) * 0.9 * s, (2.5 + r() * 0.9) * s, Math.sin(a) * 0.9 * s));
        }
        return g;
      }

      function deadTree(th, r) {
        const g = new THREE.Group();
        g.add(mesh(new THREE.CylinderGeometry(0.12, 0.25, 3, 6), mat(th.wood), 0, 1.5, 0));
        for (let i = 0; i < 3; i++) {
          const b = mesh(new THREE.CylinderGeometry(0.05, 0.1, 1.3, 5), mat(th.wood), 0, 1.6 + i * 0.5, 0);
          b.rotation.z = (i % 2 ? 1 : -1) * (0.7 + r() * 0.4);
          b.rotation.y = r() * Math.PI * 2;
          b.position.x = Math.sin(b.rotation.z) * -0.45;
          g.add(b);
        }
        return g;
      }

      function mushroom(th, r) {
        const g = new THREE.Group();
        const s = 0.8 + r() * 0.8;
        g.add(mesh(new THREE.CylinderGeometry(0.2 * s, 0.32 * s, 2.2 * s, 7), mat("#e8e0f0"), 0, 1.1 * s, 0));
        const cap = mesh(new THREE.SphereGeometry(1.2 * s, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(r() < 0.5 ? th.leaf : th.leaf2, { emissive: r() < 0.5 ? th.leaf : th.leaf2, ei: 0.35 }), 0, 2.1 * s, 0);
        cap.scale.y = 0.6;
        g.add(cap);
        for (let i = 0; i < 4; i++) {
          const a = r() * Math.PI * 2;
          g.add(mesh(new THREE.SphereGeometry(0.12 * s, 5, 4), mat("#ffffff", { emissive: "#ffffff", ei: 0.6 }), Math.cos(a) * 0.7 * s, 2.45 * s, Math.sin(a) * 0.7 * s, false));
        }
        return g;
      }

      function crystal(color, r, scale = 1) {
        const g = new THREE.Group();
        const n = 3 + Math.floor(r() * 3);
        for (let i = 0; i < n; i++) {
          const h0 = (0.8 + r() * 1.6) * scale;
          const c = mesh(new THREE.OctahedronGeometry(0.4 * scale, 0), mat(color, { emissive: color, ei: 0.75, opacity: 0.9 }), (r() - 0.5) * 0.8 * scale, h0 * 0.5, (r() - 0.5) * 0.8 * scale);
          c.scale.y = h0 / (0.8 * scale);
          c.rotation.z = (r() - 0.5) * 0.6;
          c.rotation.x = (r() - 0.5) * 0.6;
          g.add(c);
        }
        return g;
      }

      function rock(color, size, seed) {
        const m = mesh(jitter(new THREE.DodecahedronGeometry(size, 0), size * 0.18, seed), mat(color), 0, 0, 0, true, true);
        m.scale.y = 0.7;
        return m;
      }

      function bush(th, r) {
        const g = new THREE.Group();
        for (let i = 0; i < 3; i++) g.add(mesh(new THREE.IcosahedronGeometry(0.5 + r() * 0.3, 0), mat(i % 2 ? th.leaf : th.leaf2), (r() - 0.5) * 0.9, 0.35 + r() * 0.2, (r() - 0.5) * 0.9));

      function stall(roofA, roofB, wood, label) {
        const g = new THREE.Group();
        g.add(mesh(new THREE.BoxGeometry(3.2, 1.0, 1.0), mat(wood), 0, 0.5, 0, true, true));
        g.add(mesh(new THREE.BoxGeometry(3.4, 0.12, 1.25), mat(shade(wood, 0.12)), 0, 1.06, 0.05, true, true));
        for (const x of [-1.55, 1.55]) for (const z of [0.5, -1.45]) g.add(mesh(new THREE.BoxGeometry(0.14, 2.8, 0.14), mat(shade(wood, -0.05)), x, 1.4, z));
        for (let i = 0; i < 6; i++) {
          const s = mesh(new THREE.BoxGeometry(0.6, 0.1, 2.7), mat(i % 2 ? roofA : roofB), -1.5 + i * 0.6, 2.85, -0.45);
          s.rotation.x = 0.2;
          g.add(s);
          const v = mesh(new THREE.ConeGeometry(0.3, 0.35, 3), mat(i % 2 ? roofA : roofB), -1.5 + i * 0.6, 2.38, 0.92, false);
          v.rotation.x = Math.PI;
          g.add(v);
        }
        const lbl = makeLabel(label);
        lbl.position.set(0, 3.8, -0.3);
        g.add(lbl);
        return g;
      }

      function npc(shirt, hat, hatType, pants = "#3a3a4a") {

      function boat(color, wood) {
        const g = new THREE.Group();
        const hull = new THREE.BoxGeometry(4.2, 0.9, 1.8, 6, 1, 2);
        const p = hull.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i), y = p.getY(i);
          let z = p.getZ(i);
          if (x > 0.9) z *= Math.max(0.08, 1 - (x - 0.9) / 1.2);
          if (y < 0) z *= 0.62;
          p.setZ(i, z);
        }
        hull.computeVertexNormals();
        g.add(mesh(hull, mat(color), 0, 0.25, 0));
        g.add(mesh(new THREE.BoxGeometry(3.0, 0.08, 1.3), mat(wood), -0.25, 0.62, 0));
        g.add(mesh(new THREE.BoxGeometry(4.25, 0.12, 0.06), mat("#ffffff"), 0, 0.55, 0.88, false));
        g.add(mesh(new THREE.BoxGeometry(4.25, 0.12, 0.06), mat("#ffffff"), 0, 0.55, -0.88, false));
        g.add(mesh(new THREE.BoxGeometry(0.35, 0.15, 1.4), mat(shade(wood, 0.1)), 0.7, 0.75, 0));
        const mast = mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.2, 6), mat(wood), 0.3, 2.2, 0);
        g.add(mast);
        const sail = new THREE.Shape();
        sail.moveTo(0, 0); sail.lineTo(0, 2.4); sail.lineTo(1.5, 0.2);
        const sm = mesh(new THREE.ShapeGeometry(sail), mat("#fff8ea", { side: THREE.DoubleSide }), 0.38, 0.95, 0);
        g.add(sm);
        return g;
      }

      function starfish(color) {
        const s = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2;
          const rr = i % 2 ? 0.12 : 0.32;
          if (i === 0) s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
          else s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        const g = new THREE.ExtrudeGeometry(s, { depth: 0.06, bevelEnabled: false });
        g.rotateX(-Math.PI / 2);
        return mesh(g, mat(color), 0, 0, 0, false);
      }

      function mergeStatic(root) {
        root.updateMatrixWorld(true);
        const buckets = new Map();
        const remove = [];
        const visit = (o) => {
          if (o.userData.dynamic) return;
          for (const c of o.children) visit(c);
          const m = o;
          if (!m.isMesh || m.isInstancedMesh || Array.isArray(m.material)) return;
          const material = m.material;
          const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
          g.applyMatrix4(m.matrixWorld);
          for (const name of Object.keys(g.attributes)) if (name !== "position" && name !== "normal" && name !== "color") g.deleteAttribute(name);
          if (!material.vertexColors && g.attributes.color) g.deleteAttribute("color");
          if (material.vertexColors && !g.attributes.color) return;
          if (!g.attributes.normal) g.computeVertexNormals();
          g.clearGroups();
          const key = `${material.uuid}|${m.castShadow ? 1 : 0}|${m.receiveShadow ? 1 : 0}`;
          let b = buckets.get(key);
          if (!b) {
            b = { mat: material, geos: [], cast: m.castShadow, receive: m.receiveShadow };
            buckets.set(key, b);
          }
          b.geos.push(g);
          remove.push(m);
        };
        visit(root);
        const merged = [];
        for (const b of buckets.values()) {
          const geo = b.geos.length === 1 ? b.geos[0] : mergeGeometries(b.geos, false);
          if (!geo) continue;
          const mm = new THREE.Mesh(geo, b.mat);
          mm.castShadow = b.cast;
          mm.receiveShadow = b.receive;
          merged.push(mm);
          if (b.geos.length > 1) b.geos.forEach((g) => g.dispose());
        }
        const mergedMats = new Set(merged.map((m) => m.material));
        for (const m of remove) if (mergedMats.has(m.material)) m.parent?.remove(m);
        merged.forEach((m) => root.add(m));
      }

      export function buildIsland(def, labels) {
        const th = def.theme;
        const seed = def.id.split("").reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0;
        const r = mulberry32(seed);
        const group = new THREE.Group();
        const colliders = [];
        const npcs = [];
        const smoke = [];
        const ups = [];

        // Основной рельеф острова
        const baseGeo = tintVerts(jitter(new THREE.CylinderGeometry(17, 22.5, 6, 40, 3), 0.42, seed, 0.1), th.sand, 0.07, seed);
        group.add(mesh(baseGeo, mat("#ffffff", { vc: true }), 0, -2.6, 0, false, true));
        const topGeo = tintVerts(jitter(new THREE.CylinderGeometry(13, 15.6, 1.2, 36, 1), 0.3, seed + 1, 0.04), th.grass, 0.06, seed + 1);
        group.add(mesh(topGeo, mat("#ffffff", { vc: true }), 0, 0.6, 0, false, true));

        const dummy = new THREE.Object3D();
        if (def.id !== "spaceport" && def.id !== "lunar_crater") {
          const tuftGeo = new THREE.ConeGeometry(0.1, 0.35, 4);
          const tufts = new THREE.InstancedMesh(tuftGeo, mat(def.id === "frost" ? "#dfe9f2" : th.leaf2), 46);
          for (let i = 0; i < 46; i++) {
            const a = r() * Math.PI * 2, rr = 2 + r() * 10.5;
            dummy.position.set(Math.cos(a) * rr, 1.33, Math.sin(a) * rr);
            dummy.rotation.set((r() - 0.5) * 0.4, r() * 3, (r() - 0.5) * 0.4);
            dummy.scale.setScalar(0.7 + r() * 0.8);
            dummy.updateMatrix();
            tufts.setMatrixAt(i, dummy.matrix);
          }
          group.add(tufts);
        }

        // Каменная дорожка к пирсу
        for (let i = 0; i < 6; i++) {
          const st = mesh(new THREE.CylinderGeometry(0.55, 0.6, 0.1, 7), mat(shade(th.rock, 0.15)), 4.2 + i * 1.5, 1.22, i % 2 ? 0.25 : -0.25, false, true);
          st.rotation.y = r() * 3;
          group.add(st);
        }

        // Пирс
        const plankMat = new THREE.MeshLambertMaterial({ color: "#ffffff", flatShading: true });
        const nPl = Math.floor((PIER.x1 - PIER.x0) / 0.62) + 1;
        const planks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.56, 0.12, PIER.hw * 2 + 0.1), plankMat, nPl);
        const wc = new THREE.Color();
        for (let i = 0; i < nPl; i++) {
          dummy.position.set(PIER.x0 + i * 0.62, PIER.y - 0.06, (r() - 0.5) * 0.06);
          dummy.rotation.set(0, (r() - 0.5) * 0.03, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          planks.setMatrixAt(i, dummy.matrix);
          planks.setColorAt(i, wc.set(th.wood).multiplyScalar(0.85 + r() * 0.3));
        }
        planks.castShadow = true;
        planks.receiveShadow = true;
        group.add(planks);
        for (let x = 13; x <= PIER.x1; x += 3) {
          for (const z of [-PIER.hw + 0.1, PIER.hw - 0.1]) {
            group.add(mesh(new THREE.CylinderGeometry(0.15, 0.17, 4.2, 6), mat(shade(th.wood, -0.1)), x, -1.2, z));
          }
        }
        group.add(mesh(new THREE.BoxGeometry(0.12, 1.7, 0.12), mat(shade(th.wood, -0.1)), PIER.x1 - 0.3, PIER.y + 0.85, PIER.hw - 0.15));
        group.add(mesh(new THREE.BoxGeometry(0.32, 0.36, 0.32), mat("#ffe08a", { emissive: "#ffc040", ei: 1 }), PIER.x1 - 0.3, PIER.y + 1.85, PIER.hw - 0.15, false));
        const crate = mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat(shade(th.wood, 0.08)), 15, PIER.y + 0.35, -PIER.hw + 0.45);
        crate.rotation.y = 0.3;
        group.add(crate);
        colliders.push({ x: 15, z: -PIER.hw + 0.45, r: 0.5 });

        // Лодка и капитан у пирса

      const tmp = new THREE.Vector3();
      const tmp2 = new THREE.Vector3();

      function pickMutation() {
        const total = MUTATIONS.reduce((a, m) => a + m.weight, 0);
        let r = Math.random() * total;
        for (const m of MUTATIONS) {
          r -= m.weight;
          if (r <= 0) return m.id;
        }
        return MUTATIONS[0].id;
      }

      export class Fishing {
        constructor(e) {
          this.e = e;
          this.phase = "idle";
          this.t = 0;
          this.power = 0;
          this.powerDir = 1;
          this.castQ = "good";
          this.from = new THREE.Vector3();
          this.to = new THREE.Vector3();
          this.bob = new THREE.Vector3();
          this.startPos = new THREE.Vector3();
          this.biteAt = 0;
          this.nibbleAt = 0;
          this.dip = 0;
          this.hotspot = false;
          this.pending = null;
          this.mg = null;
          this.autoT = 0;
          this.autoMode = false;
          this.held = null;
          this.heldTilt = 0;
          this.heldJelly = false;
          this.heldScale = 1;
          this.sparkT = 0;
        }

        setPhase(p) {
          this.phase = p;
          this.t = 0;
          useGame.setState({ phase: p });
        }

        canAct() {
          const s = useGame.getState();
          return s.started && !s.panel && !s.fade && !s.adBusy;
        }

        press() {
          if (!this.canAct()) return;
          switch (this.phase) {
            case "idle": {
              if (ISLAND_MAP[useGame.getState().island]?.noFishing) {
                toast("🚀 " + t("noFishingHere"), "#ffe066");
                audio.play("error");
                return;
              }
              if (isBagFull()) {
                toast("🎒 " + t("bagFull"), "#ff8a8a");
                audio.play("error");
                return;
              }
              this.power = 0;
              this.powerDir = 1;
              this.e.faceCamera();
              this.setPhase("charging");
              audio.play("charge");
              break;
            }
            case "waiting":
              this.reelBack();
              break;
            case "bite":
              this.startMinigame();
              break;
            case "reeling":
              this.hit();
              break;
            case "caught":
              if (this.t > 0.7) this.finishCatch();
              break;
            default:
              break;
          }
        }

        release() {
          if (this.phase === "charging") this.cast(this.power, false);
        }

        findTarget(p, heading, dist) {
          const dx = Math.sin(heading), dz = Math.cos(heading);
          for (let d = dist; d <= 34; d += 0.5) {
            const x = p.x + dx * d, z = p.z + dz * d;
            if (isWater(x, z)) return new THREE.Vector3(x, 0, z);
          }
          return null;
        }

        cast(power, auto) {
          const e = this.e;
          const q = power >= 0.92 ? "perfect" : power >= 0.75 ? "great" : power >= 0.42 ? "good" : "ok";
          const target = this.findTarget(e.player.pos, e.player.heading, 6 + power * 16);
          e.showTarget(null, false);
          if (!target) {
            if (!auto) {
              toast("🌊 " + t("aimWater"), "#ff8a8a");
              audio.play("error");
            }
            this.setPhase("idle");
            return false;
          }
          this.castQ = q;
          this.autoMode = auto;
          e.updateRodTip();
          this.from.copy(e.rodTipWorld);
          this.to.copy(target);
          this.bob.copy(this.from);
          this.hotspot = e.hotspotAt(target.x, target.z);
          if (!auto) {
            const labels = {
              perfect: [t("perfectCast"), "#ffe14d"],
              great: [t("greatCast"), "#7ef07e"],
              good: [t("goodCast"), "#ffffff"],
              ok: [t("okCast"), "#c3ccd6"],
            };
            useGame.setState({ castLabel: { text: labels[q][0], color: labels[q][1], key: Date.now() } });
            if (q === "perfect") notePerfectCast();
          }
          useGame.setState({ inHotspot: this.hotspot });
          if (this.hotspot) toast("✨ " + t("hotspot"), "#ffe14d");
          audio.play("cast");
          this.setPhase("casting");
          return true;
        }

        rollFish(island) {
          const mods = getMods();
          let lm = mods.luckMult;
          if (this.castQ === "perfect") lm *= 1.2;
          else if (this.castQ === "great") lm *= 1.08;
          if (this.hotspot) lm *= 1.5;
          const weights = RARITIES.map((r) => {
            if (r.idx === 0) return r.weight / Math.pow(Math.max(1, lm), 0.85);
            if (r.idx === 1) return r.weight / Math.pow(Math.max(1, lm), 0.25);
            return r.weight * Math.pow(Math.max(1, lm), r.boost * 0.78);
          });
          let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
          let idx = 0;
          for (; idx < weights.length - 1; idx++) {
            roll -= weights[idx];
            if (roll <= 0) break;
          }
          let pool = [];
          for (let i = idx; i >= 0 && !pool.length; i--) pool = FISH.filter((f) => f.island === island && f.rarity === RARITIES[i].id);
          if (!pool.length) pool = FISH.filter((f) => f.island === island);
          const def = pool[Math.floor(Math.random() * pool.length)];
          const weightExp = Math.max(0.65, 2.2 / Math.pow(Math.max(1, lm), 0.18));
          const w = def.minW + (def.maxW - def.minW) * Math.pow(Math.random(), weightExp);
          const mc = Math.min(1, mods.mutChance * (this.hotspot ? 1.5 : 1));
          return { def, w, mut: Math.random() < mc ? pickMutation() : null };
        }

        triggerBite() {
          const e = this.e;
          this.pending = this.rollFish(useGame.getState().island);
          this.setPhase("bite");
          audio.play("bite");
          vibrate(60);
          e.splash.emit(this.to.x, 0.15, this.to.z, { count: 18, speed: 2.4, up: 4.5, color: "#ffffff", size: 0.32, life: 0.7 });
          e.ripple(this.to.x, this.to.z);
        }

        startMinigame() {
          if (!this.pending) {
            this.reelBack();
            return;
          }
          const r = RARITY[this.pending.def.rarity];
          const ctl = getMods().control;
          const zone = Math.min(0.5, r.mg.zone * (1 + ctl / 100));
          this.mg = {
            progress: 0.25, marker: 0, dir: 1, speed: r.mg.speed, zoneStart: 0.4, zoneWidth: zone, perfectWidth: zone * 0.32,
            gain: (0.85 / r.mg.hits) * (1 + ctl / 120), drain: r.mg.drain, penalty: r.mg.penalty,
            hits: 0, perfects: 0, misses: 0, result: "", resultKey: 0, cooldown: 0, autoTarget: 0.5, rarity: r.id,
          };
          this.placeZone();
          this.setPhase("reeling");
          audio.play("hit");
          vibrate(30);
        }

        placeZone() {
          const mg = this.mg;
          let start = 0.3;
          for (let k = 0; k < 12; k++) {
            start = 0.03 + Math.random() * (0.94 - mg.zoneWidth);
            if (Math.abs(start + mg.zoneWidth / 2 - mg.marker) > 0.28) break;
          }
          mg.zoneStart = start;
          this.rollAutoTarget();
        }

        rollAutoTarget() {
          const mg = this.mg;
          mg.autoTarget =
            Math.random() < 0.87
              ? mg.zoneStart + mg.zoneWidth * (0.12 + Math.random() * 0.76)
              : mg.zoneStart > 0.5
                ? Math.max(0.01, mg.zoneStart - 0.07)
                : Math.min(0.99, mg.zoneStart + mg.zoneWidth + 0.07);
        }

        hit() {
          const mg = this.mg;
          if (!mg || mg.cooldown > 0) return;
          mg.cooldown = 0.13;
          const e = this.e;
          const c = mg.zoneStart + mg.zoneWidth / 2;
          if (mg.marker >= mg.zoneStart && mg.marker <= mg.zoneStart + mg.zoneWidth) {
            if (Math.abs(mg.marker - c) <= mg.perfectWidth / 2) {
              mg.progress += mg.gain * 1.5;
              mg.perfects++;
              mg.result = "perfect";
              audio.play("perfect");
              e.sparkles.emit(this.bob.x, this.bob.y + 0.3, this.bob.z, { count: 14, speed: 3, up: 4, color: "#ffe14d", size: 0.35, life: 0.8, gravity: -4 });
            } else {
              mg.progress += mg.gain;
              mg.hits++;
              mg.result = "good";
              audio.play("hit");
            }
            e.splash.emit(this.bob.x, 0.15, this.bob.z, { count: 8, speed: 2, up: 3.5, color: "#ffffff", size: 0.25, life: 0.6 });
            this.placeZone();
            vibrate(15);
          } else {
            mg.progress -= mg.penalty;
            mg.misses++;
            mg.result = "miss";
            audio.play("miss");
            this.rollAutoTarget();
          }
          mg.resultKey++;
        }

        updateMinigame(dt) {
          const mg = this.mg;
          const e = this.e;
          mg.cooldown -= dt;
          const prev = mg.marker;
          mg.marker += mg.dir * mg.speed * 2 * dt;
          if (mg.marker >= 1) {
            mg.marker = 1;
            mg.dir = -1;
          } else if (mg.marker <= 0) {
            mg.marker = 0;
            mg.dir = 1;
          }
          mg.progress -= mg.drain * dt;
          if (this.autoMode && mg.cooldown <= 0 && (prev - mg.autoTarget) * (mg.marker - mg.autoTarget) <= 0) this.hit();
          const ang = this.t * 1.7;
          const rad = 0.6 + Math.sin(this.t * 2.3) * 0.3;
          const x = this.to.x + Math.cos(ang) * rad;
          const z = this.to.z + Math.sin(ang * 1.3) * rad;
          this.bob.set(x, waveHeight(x, z, e.time, e.waveAmp) - 0.16 + Math.sin(this.t * 11) * 0.05, z);
          if (Math.random() < dt * 5) e.splash.emit(x, 0.12, z, { count: 4, speed: 1.6, up: 2.6, color: "#ffffff", size: 0.22, life: 0.5 });
          if (Math.random() < dt * 2) e.ripple(x, z);
          if (mg.progress >= 1) this.caught();
          else if (mg.progress <= 0) this.escape();
        }

        caught() {
          const p = this.pending;
          const mg = this.mg;
          const e = this.e;
          const perfect = mg.misses === 0 && mg.perfects > mg.hits;
          let w = p.w;
          let mut = p.mut;
          if (perfect) {
            w = Math.min(p.def.maxW * 1.1, w * 1.08);
            if (!mut && Math.random() < getMods().mutChance * 2) mut = pickMutation();
          }
          const { item, isNew } = addCatch(p.def, w, mut);
          useGame.setState({ catchInfo: { fish: item, isNew, perfect, key: Date.now() } });
          this.held = createFishMesh(p.def, mut, fishDisplayLength(w));
          this.held.rotation.order = "YXZ";
          this.heldTilt = p.def.shape === "ray" ? 1.15 : 0;
          this.heldJelly = p.def.shape === "jelly";
          this.heldScale = this.held.scale.x;
          e.scene.add(this.held);
          this.startPos.copy(this.bob);
          this.held.position.copy(this.bob);
          const rIdx = RARITY[p.def.rarity].idx;
          audio.play(rIdx >= 3 || mut ? "rare" : "catch");
          audio.play("splash");
          vibrate([40, 40, 90]);
          e.splash.emit(this.bob.x, 0.2, this.bob.z, { count: 30, speed: 3.5, up: 6, color: "#ffffff", size: 0.4, life: 0.9 });
          if (rIdx >= 2) e.sparkles.emit(this.bob.x, 1, this.bob.z, { count: 30, speed: 4, up: 5, color: RARITY[p.def.rarity].color, size: 0.45, life: 1.2, gravity: -3 });
          this.mg = null;
          this.pending = null;
          e.showcase = true;
          this.setPhase("caught");
        }

        escape() {
          toast("🐟 " + t("escaped"), "#ff8a8a");
          audio.play("escape");
          this.mg = null;
          this.pending = null;
          this.reelBack();
        }

        reelBack() {
          this.startPos.copy(this.bob);
          this.setPhase("reelback");
        }

        finishCatch() {
          if (this.held) {
            this.e.scene.remove(this.held);
            disposeFish(this.held);
            this.held = null;
          }
          this.e.showcase = false;
          this.setPhase("idle");
        }

        cancel() {
          if (this.held) {
            this.e.scene.remove(this.held);
            disposeFish(this.held);
            this.held = null;
          }
          this.mg = null;
          this.pending = null;
          this.e.showcase = false;
          this.e.showTarget(null, false);
          this.setPhase("idle");
        }

        update(dt) {
          this.t += dt;
          const e = this.e;
          const s = useGame.getState();
          switch (this.phase) {
            case "idle": {
              const can = s.autoOn && autoAvailable(s) && this.canAct() && !e.moving && !ISLAND_MAP[s.island]?.noFishing;
              if (!can) {
                this.autoT = 0;
                break;
              }
              this.autoT += dt;
              if (this.autoT < 0.9) break;
              this.autoT = 0;
              if (isBagFull(s)) {
                toast("🎒 " + t("bagFull"), "#ff8a8a");
                useGame.setState({ autoOn: false });
                break;
              }
              let heading = e.cameraHeading();
              if (!this.findTarget(e.player.pos, heading, 18)) {
                const ox = e.player.pos.x, oz = e.player.pos.z;
                heading = ox * ox + oz * oz < 0.01 ? Math.PI / 2 : Math.atan2(ox, oz);
              }
              e.player.heading = heading;
              if (!this.cast(0.62 + Math.random() * 0.36, true)) {
                useGame.setState({ autoOn: false });
                toast(t("autoNeedWater"), "#ff8a8a");
              }
              break;
            }
            case "charging": {
              this.power += this.powerDir * dt * 1.15;
              if (this.power >= 1) {
                this.power = 1;
                this.powerDir = -1;
              } else if (this.power <= 0) {
                this.power = 0;
                this.powerDir = 1;
              }
              e.faceCamera();
              const tg = this.findTarget(e.player.pos, e.player.heading, 6 + this.power * 16);
              e.showTarget(tg, tg ? e.hotspotAt(tg.x, tg.z) : false);
              break;
            }
            case "casting": {
              const dur = 0.75;
              const k = Math.min(1, this.t / dur);
              tmp.copy(this.from).lerp(this.to, 0.5);
              tmp.y += 4 + this.from.distanceTo(this.to) * 0.15;
              const a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
              this.bob.set(
                a * this.from.x + b * tmp.x + c * this.to.x,
                a * this.from.y + b * tmp.y + c * this.to.y,
                a * this.from.z + b * tmp.z + c * this.to.z
              );
              if (k >= 1) {
                e.splash.emit(this.to.x, 0.1, this.to.z, { count: 14, speed: 2, up: 3.5, color: "#ffffff", size: 0.28, life: 0.6 });
                e.ripple(this.to.x, this.to.z);
                audio.play("splash");
                const mods = getMods();
                let wait = (3.5 + Math.random() * 5.5) / mods.speedMult;
                if (this.hotspot) wait *= 0.6;
                if (this.castQ === "ok") wait *= 1.15;
                this.biteAt = Math.max(1.2, wait);
                this.nibbleAt = 0.8 + Math.random() * 1.4;
                this.setPhase("waiting");
              }
              break;
            }
            case "waiting": {
              if (this.t > this.nibbleAt && this.t < this.biteAt - 0.5) {
                this.dip = 0.12;
                this.nibbleAt = this.t + 0.8 + Math.random() * 1.6;
                audio.play("nibble");
                e.ripple(this.to.x, this.to.z);
              }
              this.dip = Math.max(0, this.dip - dt * 0.45);
              this.bob.set(this.to.x, waveHeight(this.to.x, this.to.z, e.time, e.waveAmp) - this.dip + 0.02, this.to.z);
              if (this.t >= this.biteAt) this.triggerBite();
              break;
            }
            case "bite": {
              this.bob.set(this.to.x + Math.sin(this.t * 30) * 0.05, waveHeight(this.to.x, this.to.z, e.time, e.waveAmp) - 0.28, this.to.z);
              if (this.autoMode) {
                if (this.t > 0.35) this.startMinigame();
              } else if (this.t > 1.6) {
                toast("⏱ " + t("missedBite"), "#ff8a8a");
                audio.play("escape");
                this.pending = null;
                this.reelBack();
              }
              break;
            }
            case "reeling":
              if (this.mg) this.updateMinigame(dt);
              break;
            case "caught": {
              const held = this.held;
              if (held) {
                e.rig.root.updateMatrixWorld(true);
                e.rig.hold.getWorldPosition(tmp2);
                const jump = 0.6;
                if (this.t < jump) {
                  const k = this.t / jump;
                  held.position.lerpVectors(this.startPos, tmp2, k);
                  held.position.y += Math.sin(k * Math.PI) * 3;
                  held.rotation.set(this.heldTilt * k, e.player.heading, k * Math.PI * 2);
                } else {
                  held.position.copy(tmp2);
                  held.position.y += Math.sin(this.t * 3) * 0.05;
                  held.rotation.set(this.heldTilt, e.player.heading, Math.sin(this.t * 2.5) * 0.12);
                }
                const d = held.userData;
                if (this.heldJelly) {
                  const pulse = 1 + Math.sin(this.t * 6) * 0.12;
                  held.scale.set(this.heldScale * (2 - pulse), this.heldScale * pulse, this.heldScale * (2 - pulse));
                  d.tail.rotation.z = Math.sin(this.t * 6) * 0.18;
                } else {
                  d.tail.rotation.y = Math.sin(this.t * 16) * 0.55;
                }
                if (d.rainbow) d.mats.forEach((m) => m.color.setHSL((this.t * 0.35) % 1, 0.9, 0.62));
                this.sparkT -= dt;
                if (d.sparkle && this.sparkT <= 0) {
                  this.sparkT = 0.07;
                  e.sparkles.emit(held.position.x + (Math.random() - 0.5), held.position.y + (Math.random() - 0.5) * 0.6, held.position.z + (Math.random() - 0.5), {
                    count: 2, speed: 0.6, up: 1.2, color: d.rainbow ? new THREE.Color().setHSL(Math.random(), 1, 0.6) : "#fff3a0", size: 0.3, life: 0.7, gravity: 0.5,
                  });
                }
              }
              if (this.t > (this.autoMode ? 2.1 : 3.4)) this.finishCatch();
              break;
            }
            case "reelback": {
              const k = Math.min(1, this.t / 0.35);
              e.updateRodTip();
              this.bob.lerpVectors(this.startPos, e.rodTipWorld, k);
              if (k >= 1) this.setPhase("idle");
              break;
            }
          }
        }
      }

      const STORM_TOP = new THREE.Color("#3a4450");
      const STORM_HOR = new THREE.Color("#8a96a0");
      const NIGHT_TOP = new THREE.Color("#060a24");
      const NIGHT_HOR = new THREE.Color("#2a2a66");

      const beamVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;

      void main(){ float a = (1.0 - vUv.y) * uAlpha; gl_FragColor = vec4(uColor, a); }`;

      export class Engine {
