              if (s.island !== p.island) this.setIsland(s.island, false);
              if (s.curLang !== p.curLang) this.rebuildLabels();
              if (s.lowGfx !== p.lowGfx) this.applyQuality(s.lowGfx);
              if (s.started && !p.started) {
                this.curYaw = this.menuYaw;
                this.cam.yaw = -Math.PI / 2;
              }
            })
          );

          const st0 = useGame.getState();
          this.paused = st0.hidden || st0.adBusy || st0.sdkPaused;
          if (st0.lowGfx) this.applyQuality(true);
          this.bindInput();
          this.ro = new ResizeObserver(() => this.resize());
          this.ro.observe(container);
          this.resize();
          this.loop = this.loop.bind(this);
          this.loop();
        }

        buildClouds() {
          const geo = new THREE.IcosahedronGeometry(1, 0);
          for (let i = 0; i < 14; i++) {
            const c = new THREE.Group();
            const n = 3 + Math.floor(Math.random() * 3);
            for (let k = 0; k < n; k++) {
              const m = new THREE.Mesh(geo, this.cloudMat);
              m.position.set(k * 3 - n * 1.5 + Math.random(), Math.random() * 1.5, Math.random() * 3 - 1.5);
              m.scale.setScalar(3 + Math.random() * 3);
              m.scale.y *= 0.65;
              c.add(m);
            }
            const a = Math.random() * Math.PI * 2;
            const rr = 60 + Math.random() * 170;
            c.position.set(Math.cos(a) * rr, 45 + Math.random() * 30, Math.sin(a) * rr);
            this.clouds.add(c);
          }
          this.scene.add(this.clouds);
        }

        buildBirds() {
          const wingGeo = new THREE.BoxGeometry(0.9, 0.04, 0.32).translate(0.45, 0, 0);
          for (let i = 0; i < 4; i++) {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.18, 0.6), mat("#ffffff")));
            const wl = new THREE.Group();
            const wr = new THREE.Group();
            wl.add(new THREE.Mesh(wingGeo, mat("#f0f0f0")));
            const wrm = new THREE.Mesh(wingGeo, mat("#f0f0f0"));
            wrm.rotation.y = Math.PI;
            wr.add(wrm);
            wl.position.x = 0.1;
            wr.position.x = -0.1;
            g.add(wl, wr);
            this.scene.add(g);
            this.birds.push({ g, wl, wr, r: 18 + Math.random() * 18, h: 12 + Math.random() * 7, sp: 0.18 + Math.random() * 0.12, ph: Math.random() * 6 });
          }
        }

        setIsland(id, keepPlayer) {
          const def = ISLAND_MAP[id] ?? ISLAND_MAP.sunny;
          if (this.island) this.island.group.visible = false;
          let b = this.islands.get(def.id);
          if (!b) {
            b = buildIsland(def, {
              merchant: t("npcMerchant"),
              shop: t("npcShop"),
              boat: t("npcBoat"),
              rocket: t("npcRocket"),
              earthRocket: t("npcEarthRocket"),
            });
            this.islands.set(def.id, b);
            this.scene.add(b.group);
          }
          b.group.visible = true;
          this.island = b;
          this.islandId = def.id;
          this.recent = [def.id, ...this.recent.filter((x) => x !== def.id)];
          this.trimIslandCache();
          const th = def.theme;
          this.theme = th;
          this.base.top.set(th.skyTop);
          this.base.hor.set(th.skyHorizon);
          this.base.fog.set(th.fog);
          this.base.deep.set(th.waterDeep);
          this.base.shallow.set(th.waterShallow);
          const fog = this.scene.fog;
          fog.near = th.fogNear;
          fog.far = th.fogFar;
          this.water.u.uFogNear.value = th.fogNear;
          this.water.u.uFogFar.value = th.fogFar;
          this.water.u.uFoam.value.set(th.foam);
          const sd = new THREE.Vector3(...th.sunDir).normalize();
          this.water.u.uSunDir.value.copy(sd);
          this.sky.u.uSunDir.value.copy(sd);
          this.sun.color.set(th.sun);
          this.water.u.uSunColor.value.set(th.sun);
          this.sky.u.uSunColor.value.set(th.sun);
          this.hemi.color.set(th.hemiSky);
          this.hemi.groundColor.set(th.hemiGround);
          this.cloudMat.color.set(th.cloud);
          const birdsOn = ["sunny", "coral", "frost", "sunken", "celestial"].includes(def.id);
          this.birds.forEach((bd) => (bd.g.visible = birdsOn));
          if (!keepPlayer) {
            this.fishing.cancel();
            this.player.pos.set(SPAWN.x, 1.2, SPAWN.z);
            this.player.heading = SPAWN.heading;
            this.cam.yaw = -Math.PI / 2;
            this.curYaw = this.cam.yaw;
            this.camTarget.set(SPAWN.x, 2.8, SPAWN.z);
            this.respawnHotspots();
          }
          this.applyEnv(10);
        }

        trimIslandCache(keep = 3) {
          for (const id of this.recent.slice(keep)) {
            const b = this.islands.get(id);
            if (!b) continue;
            this.scene.remove(b.group);
            b.group.traverse((o) => {
              if (o.isMesh) o.geometry.dispose();
            });
            this.islands.delete(id);
          }
          this.recent = this.recent.slice(0, keep);
        }

        rebuildLabels() {
          for (const [, b] of this.islands) {
            this.scene.remove(b.group);
            b.group.traverse((o) => {
              if (o.isMesh) o.geometry.dispose();
            });
          }
          this.islands.clear();
          this.recent = [];
          this.island = null;
          this.setIsland(this.islandId, true);
        }

        makeHotspot() {
          const g = new THREE.Group();
          const ringMat = new THREE.MeshBasicMaterial({ color: "#ffe14d", transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
          const ring = new THREE.Mesh(new THREE.RingGeometry(2.3, 2.75, 36), ringMat);
          ring.rotation.x = -Math.PI / 2;
          g.add(ring);
          const disc = new THREE.Mesh(new THREE.CircleGeometry(2.3, 30), new THREE.MeshBasicMaterial({ color: "#ffd23a", transparent: true, opacity: 0.18, depthWrite: false, blending: THREE.AdditiveBlending }));
          disc.rotation.x = -Math.PI / 2;
          g.add(disc);
          const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(1.4, 2.3, 16, 20, 1, true).translate(0, 8, 0),
            new THREE.ShaderMaterial({ uniforms: { uColor: { value: new THREE.Color("#ffe680") }, uAlpha: { value: 0.35 } }, vertexShader: beamVert, fragmentShader: beamFrag, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
          );
          g.add(beam);
          g.renderOrder = 4;
          this.scene.add(g);
          const hs = { group: g, x: 0, z: 0, ttl: 0, vis: 0, dying: false };
          this.relocate(hs);
          return hs;
        }

        relocate(hs) {
          for (let k = 0; k < 30; k++) {
            const a = Math.random() * Math.PI * 2;
            if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) < 0.22) continue;
            const rr = 21 + Math.random() * 9;
            const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
            if (this.hotspots.some((o) => o !== hs && Math.hypot(o.x - x, o.z - z) < 9)) continue;
            hs.x = x;
            hs.z = z;
            break;
          }
          hs.ttl = 70 + Math.random() * 35;
          hs.vis = 0;
          hs.dying = false;
        }

        respawnHotspots() {
          this.hotspots.forEach((h) => this.relocate(h));
        }

        hotspotAt(x, z) {
          return this.hotspots.some((h) => h.group.visible && h.vis > 0.5 && Math.hypot(h.x - x, h.z - z) < 3.2);
        }

        updateHotspots(dt, frenzy) {
          const noFish = !!ISLAND_MAP[this.islandId]?.noFishing;
          const want = noFish ? 0 : frenzy ? 4 : 2;
          while (this.hotspots.length < want) this.hotspots.push(this.makeHotspot());
          this.bubbleT -= dt;
          const emit = this.bubbleT <= 0;
          if (emit) this.bubbleT = 0.12;
          this.hotspots.forEach((h, i) => {
            const active = i < want;
            h.ttl -= dt;
            if (h.ttl <= 0 || !active) h.dying = true;
            h.vis = clamp(h.vis + (h.dying ? -dt : dt) * 0.8, 0, 1);
            if (h.dying && h.vis <= 0) {
              if (active) this.relocate(h);
            }
            h.group.visible = h.vis > 0.01;
            if (!h.group.visible) return;
            const y = waveHeight(h.x, h.z, this.time, this.waveAmp);
            h.group.position.set(h.x, y + 0.06, h.z);
            const pulse = 1 + Math.sin(this.time * 3 + i) * 0.06;
            h.group.scale.set(pulse * h.vis, 1, pulse * h.vis);
            if (emit && h.vis > 0.5) {
              this.sparkles.emit(h.x + (Math.random() - 0.5) * 3, y + 0.1, h.z + (Math.random() - 0.5) * 3, { count: 1, speed: 0.2, up: 1.6, color: "#fff3a0", size: 0.3, life: 1.4, gravity: 0.6 });
            }
          });
        }

        cameraHeading() {
          return Math.atan2(-Math.sin(this.cam.yaw), -Math.cos(this.cam.yaw));
        }
        faceCamera() {
          this.player.heading = this.cameraHeading();
        }
        updateRodTip() {
          this.rig.root.position.copy(this.player.pos);
          this.rig.root.rotation.y = this.player.heading;
          this.rig.root.updateMatrixWorld(true);
          this.rig.rodTip?.getWorldPosition(this.rodTipWorld);
        }
        showTarget(p, hot) {
          if (!p) {
            this.targetRing.visible = false;
            return;
          }
          this.targetRing.visible = true;
          this.targetRing.position.set(p.x, waveHeight(p.x, p.z, this.time, this.waveAmp) + 0.08, p.z);
          this.targetRing.material.color.set(hot ? "#ffe14d" : isWater(p.x, p.z) ? "#7ef07e" : "#ff6a6a");
          this.targetRing.scale.setScalar(1 + Math.sin(this.time * 8) * 0.08);
        }
        ripple(x, z) {
          const r = this.ripples[this.rippleIdx];
          this.rippleIdx = (this.rippleIdx + 1) % this.ripples.length;
          r.t = 0;
          r.m.position.set(x, 0, z);
          r.m.visible = true;
        }

        bindInput() {
          const el = this.renderer.domElement;
          const onKeyDown = (e) => {
            // Пункт 1.6.2.6: Игнорируем системные сочетания клавиш
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            const tag = document.activeElement?.tagName;
            if (tag === "INPUT" || tag === "TEXTAREA") {
              if (e.code === "Escape") document.activeElement.blur();
              return;
            }
            const s = useGame.getState();
            if (e.code === "Escape") {
              if (s.panel) openPanel(null);
              return;
            }
            if (s.panel || !s.started) return;
            if (e.code === "Space") {
              e.preventDefault();
              const ae = document.activeElement;
              if (ae && ae !== document.body) ae.blur();
              if (!e.repeat) this.fishing.press();
              return;
            }
            if ((e.code === "KeyE" || e.code === "KeyF") && !e.repeat) this.interact();
            this.keys.add(e.code);
          };
          const onKeyUp = (e) => {
            this.keys.delete(e.code);
            if (e.code === "Space") {
              e.preventDefault();
              this.fishing.release();
            }
          };
          const onBlur = () => {
            this.keys.clear();
            this.fishing.release();
          };
          const onDown = (e) => {
            el.setPointerCapture?.(e.pointerId);
            this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (this.pointers.size === 2) this.pinch = this.pinchDist();
          };
          const onMove = (e) => {
            const p = this.pointers.get(e.pointerId);
            if (!p) return;
            const dx = e.clientX - p.x, dy = e.clientY - p.y;
            p.x = e.clientX;
            p.y = e.clientY;
            if (!useGame.getState().started) return;
            if (this.pointers.size === 1) {
              const k = e.pointerType === "touch" ? 0.008 : 0.006;
              this.cam.yaw -= dx * k;
              this.cam.pitch = clamp(this.cam.pitch + dy * k * 0.8, 0.06, 1.25);
            } else if (this.pointers.size === 2) {
              const d = this.pinchDist();
              if (this.pinch > 0 && d > 0) this.cam.dist = clamp((this.cam.dist * this.pinch) / d, 5, 20);
              this.pinch = d;
            }
          };
          const onUp = (e) => {
            this.pointers.delete(e.pointerId);
            this.pinch = this.pointers.size === 2 ? this.pinchDist() : 0;
          };
          const onWheel = (e) => {
            e.preventDefault();
            this.cam.dist = clamp(this.cam.dist * (1 + Math.sign(e.deltaY) * 0.09), 5, 20);
          };
          const onCtx = (e) => e.preventDefault();
          window.addEventListener("keydown", onKeyDown);
          window.addEventListener("keyup", onKeyUp);
          window.addEventListener("blur", onBlur);
          el.addEventListener("pointerdown", onDown);
          el.addEventListener("pointermove", onMove);
          el.addEventListener("pointerup", onUp);
          el.addEventListener("pointercancel", onUp);
          el.addEventListener("wheel", onWheel, { passive: false });
          el.addEventListener("contextmenu", onCtx);
          this.unsubs.push(() => {
            window.removeEventListener("keydown", onKeyDown);
            window.removeEventListener("keyup", onKeyUp);
            window.removeEventListener("blur", onBlur);
            el.removeEventListener("pointerdown", onDown);
            el.removeEventListener("pointermove", onMove);
            el.removeEventListener("pointerup", onUp);
            el.removeEventListener("pointercancel", onUp);
            el.removeEventListener("wheel", onWheel);
            el.removeEventListener("contextmenu", onCtx);
          });
        }

        pinchDist() {
          const pts = [...this.pointers.values()];
          if (pts.length < 2) return 0;
          return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }

        press() {
          this.fishing.press();
        }
        release() {
          this.fishing.release();
        }
        setJoy(x, y) {
          this.joy.x = x;
          this.joy.y = y;
        }
        interact() {
          const n = this.nearNpc;
          if (!n || this.fishing.phase !== "idle") return;
          if (n === "merchant") openPanel("bag");
          else if (n === "shop") {
            const isMoon = (ISLAND_MAP[useGame.getState().island]?.planet ?? 1) === 2;
            if (isMoon) {
              useGame.setState({ panel: "lunar", lunarTab: "gear" });
              audio.play("click");
            } else {
              openPanel("shop", "rods");
            }
          } else if (n === "rocket") void launchRocketToMoon();
          else if (n === "earth_rocket") void travelTo("spaceport");
          else openPanel("map");
        }
        setPaused(p) {
          this.paused = p;
          if (p) {
            this.keys.clear();
            this.fishing.release();
          }
        }

        applyQuality(low) {
          this.sun.castShadow = !low;
          this.renderer.setPixelRatio(low ? 1 : Math.min(window.devicePixelRatio || 1, this.isMobile ? 1.5 : 2));
          this.resize();
        }

        resize() {
          const w = this.container.clientWidth || 1;
          const h0 = this.container.clientHeight || 1;
          this.renderer.setSize(w, h0);
          this.camera.aspect = w / h0;
          this.camera.fov = w / h0 < 0.8 ? 68 : 55;
          this.camera.updateProjectionMatrix();
          pointScale.value = (h0 * this.renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(this.camera.fov) / 2));
        }

        applyEnv(dt) {
          const s = useGame.getState();
          const ev = s.event && s.event.until > Date.now() ? s.event.id : null;
          this.stormMix = damp(this.stormMix, ev === "storm" ? 1 : 0, 0.7, dt);
          this.starMix = damp(this.starMix, ev === "starfall" ? 1 : 0, 0.7, dt);
          const th = this.theme;
          const sm = this.stormMix, st = this.starMix;
          const top = this.tmpC.copy(this.base.top).lerp(STORM_TOP, sm * 0.8).lerp(NIGHT_TOP, st * 0.85);
          this.sky.u.uTop.value.copy(top);
          const hor = this.tmpC2.copy(this.base.hor).lerp(STORM_HOR, sm * 0.75).lerp(NIGHT_HOR, st * 0.8);
          this.sky.u.uHorizon.value.copy(hor);
          this.water.u.uSky.value.copy(hor);
          const fog = this.scene.fog.color;
          fog.copy(this.base.fog).lerp(STORM_HOR, sm * 0.7).lerp(NIGHT_HOR, st * 0.8);
          this.water.u.uFogColor.value.copy(fog);
          this.sky.u.uStars.value = Math.max(th.stars, st);
          const dim = (1 - 0.5 * sm) * (1 - 0.45 * st);
          this.sun.intensity = th.sunIntensity * dim;
          this.hemi.intensity = th.hemiIntensity * (1 - 0.3 * sm) * (1 - 0.3 * st);
          this.water.u.uDeep.value.copy(this.base.deep).multiplyScalar(1 - 0.3 * Math.max(sm, st));
          this.water.u.uShallow.value.copy(this.base.shallow).multiplyScalar(1 - 0.25 * Math.max(sm, st));
          this.waveAmp = th.waveAmp * (1 + 0.9 * sm);
          this.water.u.uAmp.value = this.waveAmp;
          const w = ev === "storm" ? "rain" : ev === "starfall" ? "stars" : th.weather;
          this.weather.setType(w);
        }

        updatePlayer(dt) {
          const s = useGame.getState();
          const ph = this.fishing.phase;
          let ix = this.joy.x, iy = this.joy.y;
          if (this.keys.has("KeyW") || this.keys.has("ArrowUp")) iy += 1;
          if (this.keys.has("KeyS") || this.keys.has("ArrowDown")) iy -= 1;
          if (this.keys.has("KeyA") || this.keys.has("ArrowLeft")) ix -= 1;
          if (this.keys.has("KeyD") || this.keys.has("ArrowRight")) ix += 1;
          let len = Math.hypot(ix, iy);
          if (len > 1) {
            ix /= len;
            iy /= len;
            len = 1;
          }
          const canMove = s.started && !s.panel && !s.fade && (ph === "idle" || ph === "waiting" || ph === "reelback");
          this.moving = false;
          const p = this.player.pos;
          if (canMove && len > 0.08) {
            if (ph === "waiting") this.fishing.reelBack();
            const y = this.cam.yaw;
            const mx = -Math.sin(y) * iy + Math.cos(y) * ix;
            const mz = -Math.cos(y) * iy - Math.sin(y) * ix;
            const sp = 6.4 * Math.min(1, len);
            let nx = p.x + mx * sp * dt;
            let nz = p.z + mz * sp * dt;
            for (const c of this.island?.colliders ?? []) {
              const dx = nx - c.x, dz = nz - c.z;
              const d = Math.hypot(dx, dz);
              const minD = c.r + 0.45;
              if (d < minD && d > 1e-4) {
                nx = c.x + (dx / d) * minD;
                nz = c.z + (dz / d) * minD;
              }
            }
            if (!isWalkable(nx, nz)) {
              if (isWalkable(nx, p.z)) nz = p.z;
              else if (isWalkable(p.x, nz)) nx = p.x;
              else {
                nx = p.x;
                nz = p.z;
              }
            }
            if (Math.hypot(nx - p.x, nz - p.z) > 1e-4) this.moving = true;
            p.x = nx;
            p.z = nz;
            this.player.heading = lerpAngle(this.player.heading, Math.atan2(mx, mz), 1 - Math.exp(-14 * dt));
          }
          if (ph === "caught") {
            const cx = this.camera.position.x - p.x, cz = this.camera.position.z - p.z;
            this.player.heading = lerpAngle(this.player.heading, Math.atan2(cx, cz), 1 - Math.exp(-8 * dt));
          }
          p.y = damp(p.y, groundHeight(p.x, p.z), 14, dt);

          let best = null;
          let bd = 3.3;
          for (const n of this.island?.npcs ?? []) {
            const d = Math.hypot(p.x - n.x, p.z - n.z);
            if (d < bd) {
              bd = d;
              best = n.kind;
            }
          }
          if (best !== this.nearNpc) {
            this.nearNpc = best;
            useGame.setState({ nearNpc: best });
          }
        }

        animateRig(dt) {
          const rig = this.rig;
          const f = this.fishing;
          const ph = f.phase;
          const tm = this.time;
          this.walkBlend = damp(this.walkBlend, this.moving ? 1 : 0, 10, dt);
          if (this.moving) this.walkPhase += dt * 11;
          const sw = Math.sin(this.walkPhase) * 0.75 * this.walkBlend;
          rig.legL.rotation.x = sw;
          rig.legR.rotation.x = -sw;
          rig.body.position.y = Math.abs(Math.cos(this.walkPhase)) * 0.09 * this.walkBlend + Math.sin(tm * 2) * 0.012;
          let armR = -0.5 + sw * 0.15;
          let armL = -sw * 0.8;
          let lean = 0;
          let bend = 0.04;
          switch (ph) {
            case "charging": armR = -0.9 - f.power * 2.4; armL = -0.4; lean = -0.08 * f.power; bend = 0; break;
            case "casting": armR = -1.0; armL = -0.3; bend = 0.1; break;
            case "waiting": armR = -0.75 + Math.sin(tm * 1.5) * 0.03; armL = -0.5; bend = 0.08; break;
            case "bite": armR = -0.95 + Math.sin(tm * 40) * 0.05; armL = -0.7; bend = 0.35; break;
            case "reeling": armR = -1.05 + Math.sin(tm * 22) * 0.06; armL = -0.9 + Math.sin(tm * 14) * 0.35; lean = -0.12; bend = 0.45 + Math.sin(tm * 9) * 0.12; break;
            case "caught": armR = -1.75; armL = -1.75; break;
            case "reelback": armR = -0.8; break;
            default: break;
          }
          rig.armR.rotation.x = damp(rig.armR.rotation.x, armR, ph === "casting" ? 24 : 12, dt);
          rig.armL.rotation.x = damp(rig.armL.rotation.x, armL, 10, dt);
          rig.body.rotation.x = damp(rig.body.rotation.x, lean, 8, dt);
          if (rig.rodPivots.length === 3) {
            rig.rodPivots[1].rotation.x = damp(rig.rodPivots[1].rotation.x, bend * 0.5, 10, dt);
            rig.rodPivots[2].rotation.x = damp(rig.rodPivots[2].rotation.x, bend * 0.8, 10, dt);
          }
          if (rig.rod) rig.rod.visible = ph !== "caught";
          rig.root.position.copy(this.player.pos);
          rig.root.rotation.y = this.player.heading;
          const rod = ROD_MAP[useGame.getState().rod];
          if (rod?.rainbow && rig.rodMain) {
            rig.rodMain.color.setHSL((tm * 0.2) % 1, 0.85, 0.65);
            rig.rodMain.emissive.copy(rig.rodMain.color);
          }
        }

        animateNpcs() {
          const tm = this.time;
          (this.island?.npcs ?? []).forEach((n, i) => {
            const r = n.rig;
            r.body.position.y = Math.sin(tm * 2 + i) * 0.02;
            r.armL.rotation.x = Math.sin(tm * 1.4 + i) * 0.12;
            const waving = this.nearNpc === n.kind;
            r.armR.rotation.x = waving ? -2.7 + Math.sin(tm * 9) * 0.25 : Math.sin(tm * 1.4 + i + 1) * 0.12;
            r.head.rotation.y = Math.sin(tm * 0.6 + i * 2) * 0.35;
          });
        }

        updateLine() {
          const f = this.fishing;
          const ph = f.phase;
          const on = ph === "casting" || ph === "waiting" || ph === "bite" || ph === "reeling" || ph === "reelback";
          this.bobber.visible = on;
          this.line.visible = on;
          this.exclaim.visible = ph === "bite";
          if (this.exclaim.visible) {
            const s = 1.1 + Math.abs(Math.sin(this.time * 10)) * 0.25;
            this.exclaim.scale.set(s, s, 1);
            this.exclaim.position.set(this.player.pos.x, this.player.pos.y + 3.2, this.player.pos.z);
          }
          if (!on) return;
          this.bobber.position.copy(f.bob);
          this.rig.root.updateMatrixWorld(true);
          this.rig.rodTip?.getWorldPosition(this.rodTipWorld);
          const a = this.rodTipWorld, b = f.bob;
          const sag = ph === "waiting" ? 1.0 : ph === "casting" || ph === "reelback" ? 0.25 : 0.06;
          const n = 24;
          for (let i = 0; i < n; i++) {
            const k = i / (n - 1);
            this.linePos[i * 3] = a.x + (b.x - a.x) * k;
            this.linePos[i * 3 + 1] = a.y + (b.y + 0.15 - a.y) * k - Math.sin(k * Math.PI) * sag;
            this.linePos[i * 3 + 2] = a.z + (b.z - a.z) * k;
          }
          this.line.geometry.attributes.position.needsUpdate = true;
        }

        updateCamera(dt) {
          const s = useGame.getState();
          let tx, ty, tz, dist, yaw, pitch;
          if (!s.started) {
            this.menuYaw += dt * 0.07;
            tx = 2; ty = 2; tz = 0; dist = 30; yaw = this.menuYaw; pitch = 0.3;
          } else {
            tx = this.player.pos.x; ty = this.player.pos.y + 1.7; tz = this.player.pos.z;
            dist = this.showcase ? 6.4 : this.cam.dist;
            yaw = this.cam.yaw;
            pitch = this.showcase ? Math.min(this.cam.pitch, 0.3) : this.cam.pitch;
          }
          const k = 1 - Math.exp(-7 * dt);
          this.camTarget.x += (tx - this.camTarget.x) * k;
          this.camTarget.y += (ty - this.camTarget.y) * k;
          this.camTarget.z += (tz - this.camTarget.z) * k;
          this.curDist = damp(this.curDist, dist, 4, dt);
          this.curYaw = lerpAngle(this.curYaw, yaw, 1 - Math.exp(-(s.started ? 16 : 3) * dt));
          this.curPitch = damp(this.curPitch, pitch, 10, dt);
          const cp = Math.cos(this.curPitch);
          const c = this.camera.position;
          c.set(
            this.camTarget.x + Math.sin(this.curYaw) * cp * this.curDist,
            this.camTarget.y + Math.sin(this.curPitch) * this.curDist,
            this.camTarget.z + Math.cos(this.curYaw) * cp * this.curDist
          );
          const minY = waveHeight(c.x, c.z, this.time, this.waveAmp) + 0.8;
          if (c.y < minY) c.y = minY;
          this.camera.lookAt(this.camTarget);
        }

        update(dt) {
          this.time += dt;
          const s = useGame.getState();
          const tm = this.time;
          this.applyEnv(dt);
          this.updatePlayer(dt);
          this.fishing.update(dt);
          this.animateRig(dt);
          this.animateNpcs();
          this.updateLine();
          this.island?.update(tm, dt, this.waveAmp);
          const frenzy = !!(s.event && s.event.id === "frenzy" && s.event.until > Date.now());
          this.updateHotspots(dt, frenzy);

          for (const r of this.ripples) {
            if (r.t >= 1) continue;
            r.t += dt / 1.2;
            if (r.t >= 1) {
              r.m.visible = false;
              continue;
            }
            r.m.position.y = waveHeight(r.m.position.x, r.m.position.z, tm, this.waveAmp) + 0.04;
            r.m.scale.setScalar(1 + r.t * 5);
            r.m.material.opacity = (1 - r.t) * 0.75;
          }

          this.smokeT -= dt;
          if (this.smokeT <= 0 && this.island?.smoke.length) {
            this.smokeT = 0.18;
            const sm = this.island.smoke;
            const v = sm[0];
            this.splash.emit(v.x + (Math.random() - 0.5) * 6, v.y, v.z + (Math.random() - 0.5) * 6, { count: 1, speed: 1, up: 3, color: "#5a4a4a", size: 9, life: 5, gravity: 0.4, drag: 0.1 });
            const lp = sm[1 + Math.floor(Math.random() * (sm.length - 1))];
            if (lp && Math.random() < 0.6) this.sparkles.emit(lp.x, lp.y, lp.z, { count: 2, speed: 0.6, up: 2.5, color: "#ff8a2a", size: 0.25, life: 1.2, gravity: 0.5 });
          }

          this.splash.update(dt);
          this.sparkles.update(dt);
          this.weather.update(dt, this.camera.position, tm);

          for (const c of this.clouds.children) {
            c.position.x += dt * 1.6;
            if (c.position.x > 240) c.position.x -= 480;
          }
          this.birds.forEach((b) => {
            if (!b.g.visible) return;
            const a = tm * b.sp + b.ph;
            b.g.position.set(Math.cos(a) * b.r, b.h + Math.sin(tm * 0.7 + b.ph) * 1.2, Math.sin(a) * b.r);
            b.g.rotation.y = -a;
            const fl = Math.sin(tm * 7 + b.ph) * 0.6;
            b.wl.rotation.z = fl;
            b.wr.rotation.z = -fl;
          });

          this.updateCamera(dt);
          this.sky.mesh.position.copy(this.camera.position);
          this.water.u.uTime.value = tm;
          this.sky.u.uTime.value = tm;
          const sd = this.water.u.uSunDir.value;
          const p = this.player.pos;
          const focusX = s.started ? p.x : 2, focusZ = s.started ? p.z : 0;
          this.sun.position.set(focusX + sd.x * 50, sd.y * 50, focusZ + sd.z * 50);
          this.sun.target.position.set(focusX, 0, focusZ);
        }

        loop() {
          this.raf = requestAnimationFrame(this.loop);
          const dt = Math.min(this.clock.getDelta(), 0.05);
          if (this.paused && !this.firstFrame) return;
          this.update(dt);
          this.renderer.render(this.scene, this.camera);
          if (this.firstFrame) {
            this.firstFrame = false;
            useGame.setState({ engineReady: true });
          }
        }

        dispose() {
          cancelAnimationFrame(this.raf);
          this.unsubs.forEach((u) => u());
          this.ro.disconnect();
          this.renderer.dispose();
          this.renderer.domElement.remove();
        }
      }

      export const runtime = { engine: null };
      export const eventKey = (id) => (id === "storm" ? "evStorm" : id === "starfall" ? "evStarfall" : "evFrenzy");

      let booted = false;
      let readySent = false;

      export async function boot() {
        if (booted) return;
        booted = true;
        await YA.init();
        let isMobile = false;
        try {
          isMobile = YA.isMobile() ?? (window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window);
        } catch {
          isMobile = "ontouchstart" in window;
        }
        await Promise.race([
          Promise.all([loadSave(), document.fonts?.load?.("800 54px Rubik", "Торговец Merchant") ?? Promise.resolve()]).catch(() => undefined),
          new Promise((r) => setTimeout(r, 8000)),
        ]);
        const s = useGame.getState();
        const lang = s.lang ?? detectLang(YA.lang());
        setLangInternal(lang);
        useGame.setState({ curLang: lang, isMobile, saveLoaded: true, authorized: YA.isAuthorized() });
        startAutoSave();

        // Пункт 1.3, 1.19.4, 4.7: Остановка звука и пауза при потере фокуса, сворачивании и рекламе
        YA.onPause((p) => useGame.setState({ sdkPaused: p }));

        const syncVisibility = () => {
          const isHidden = document.hidden || !document.hasFocus();
          useGame.setState({ hidden: isHidden });
          if (isHidden) flushSave(true);
        };

        document.addEventListener("visibilitychange", syncVisibility);
        window.addEventListener("blur", () => {
          useGame.setState({ hidden: true });
          flushSave(true);
        });
        window.addEventListener("focus", () => {
          useGame.setState({ hidden: document.hidden });
        });
        window.addEventListener("pagehide", () => flushSave(true));
        window.addEventListener("beforeunload", () => flushSave(true));

        const stop = (e) => e.preventDefault();
        document.addEventListener("gesturestart", stop);
        document.addEventListener("dblclick", stop);

        window.addEventListener(
          "pointerdown",
          () => {
            const st = useGame.getState();
            if (st.started && !st.hidden && !st.adBusy && !st.sdkPaused) {
              audio.init();
            }
          },
          { capture: true }
        );

        let prevPaused = false;
        useGame.subscribe((st) => {
          const paused = st.hidden || st.adBusy || st.sdkPaused;
          if (paused !== prevPaused) {
            prevPaused = paused;
            audio.setPaused(paused);
            runtime.engine?.setPaused(paused);
          }
          // Пункт 1.19.2: Вызов LoadingAPI.ready() когда игра готова
          if (st.engineReady && !readySent) {
            readySent = true;
            YA.loadingReady();
          }
          // Пункт 1.19.3: Вызов GameplayAPI.start() / stop()
          const isGameplay = st.started && st.engineReady && !st.adBusy && !st.panel && !st.fade && !st.hidden && !st.sdkPaused;
          YA.gameplay(isGameplay);
        });

        let nextEvent = Date.now() + 150000;
        window.setInterval(() => {
          const st = useGame.getState();
          if (st.hidden || st.sdkPaused || st.adBusy) return;
          const now = Date.now();
          const patch = { now };
          if (st.event && st.event.until <= now) patch.event = null;
          if (!st.event && st.started && now >= nextEvent) {
            const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
            patch.event = { id: ev.id, until: now + ev.duration * 1000 };
            nextEvent = now + ev.duration * 1000 + (180 + Math.random() * 180) * 1000;
            toast(`${ev.icon} ${t("evStarted")} ${t(eventKey(ev.id))}`, "#ffe066");
            audio.play("quest");
          }
          if (st.autoOn && !autoAvailable(st)) {
            patch.autoOn = false;
            toast("🤖 " + t("autoOff"));
          }
          useGame.setState(patch);
        }, 1000);
      }

      export function startGame() {
        useGame.setState({ hidden: false });
        audio.init();
        const s = useGame.getState();
        audio.setSound(s.sound);
        audio.setMusic(s.music);
        useGame.setState({ started: true });
      }

      function Minigame() {
        const phase = useGame((s) => s.phase);
        const caught = useGame((s) => s.stats.caught);
        const zoneRef = useRef(null);
        const perfRef = useRef(null);
        const markRef = useRef(null);
        const progRef = useRef(null);
        const fishRef = useRef(null);
        const [res, setRes] = useState(null);
        const [rarity, setRarity] = useState(null);

        useEffect(() => {
          if (phase !== "reeling") {
            setRes(null);
            return;
          }
          let raf = 0;
          let lastKey = 0;
          const loop = () => {
            raf = requestAnimationFrame(loop);
            const mg = runtime.engine?.fishing.mg;
            if (!mg) return;
            setRarity((r) => (r === mg.rarity ? r : mg.rarity));
            if (zoneRef.current) {
              zoneRef.current.style.left = `${mg.zoneStart * 100}%`;
              zoneRef.current.style.width = `${mg.zoneWidth * 100}%`;
            }
            if (perfRef.current) {
              perfRef.current.style.left = `${((mg.zoneWidth - mg.perfectWidth) / 2 / mg.zoneWidth) * 100}%`;
              perfRef.current.style.width = `${(mg.perfectWidth / mg.zoneWidth) * 100}%`;
            }
            if (markRef.current) markRef.current.style.left = `${mg.marker * 100}%`;
            const p = Math.max(0, Math.min(1, mg.progress));
            if (progRef.current) progRef.current.style.width = `${p * 100}%`;
            if (fishRef.current) fishRef.current.style.left = `${p * 100}%`;
            if (mg.resultKey !== lastKey) {
              lastKey = mg.resultKey;
              setRes({ k: mg.resultKey, r: mg.result });
            }
          };
          loop();
          return () => cancelAnimationFrame(raf);
        }, [phase]);

        if (phase !== "reeling") return null;
        const rc = rarity ? RARITY[rarity] : null;
        const resText = res?.r === "perfect" ? t("mgPerfect") : res?.r === "good" ? t("mgGood") : res?.r === "miss" ? t("mgMiss") : "";
        const resColor = res?.r === "perfect" ? "#ffe14d" : res?.r === "good" ? "#7ef07e" : "#ff6a6a";
        return h(
          "div",
          { className: "pointer-events-none absolute bottom-[150px] left-1/2 z-20 w-[min(90vw,540px)] -translate-x-1/2 sm:bottom-[48px]" },
          res &&
            resText &&
            h("div", { key: res.k, className: "anim-float txt-o2 absolute -top-12 left-1/2 text-3xl font-extrabold", style: { color: resColor } }, resText),
          h(
            "div",

            rc && h(RarityPill, { id: rc.id })
          ),
          h(
            "div",
            { className: "relative mb-2 h-4 rounded-full border-2 border-[#0b2546] bg-[#0b2546]/70" },
            h("div", {
              ref: progRef,
              className: cn("h-full rounded-full", rc?.id === "secret" && "rainbow-bg"),
              style: { background: rc && rc.id !== "secret" ? rc.color : undefined, width: "20%" },
            }),
            h("div", { ref: fishRef, className: "absolute -top-3 -translate-x-1/2 text-xl drop-shadow" }, "🐟")
          ),
          h(
            "div",
            { className: "relative h-12 overflow-hidden rounded-2xl border-4 border-[#0b2546] bg-[#0b2546]/80 shadow-lg" },
            h(
              "div",
              { ref: zoneRef, className: "absolute inset-y-0 bg-gradient-to-b from-[#8ff58f] to-[#2fb84a]" },
              h("div", { ref: perfRef, className: "absolute inset-y-0 bg-gradient-to-b from-[#fff6a0] to-[#ffc93a] shadow-[0_0_12px_#ffe14d]" })
            ),
            h("div", { ref: markRef, className: "absolute -top-1 -bottom-1 w-2 -translate-x-1/2 rounded-full bg-white shadow-[0_0_10px_#fff]" })
          ),
          caught < 4 && h("div", { className: "txt-o mt-2 text-center text-sm font-bold text-white" }, t("hintReel"))
        );
      }

      function CoinsDisplay() {
        const coins = useGame((s) => s.coins);
        const [shown, setShown] = useState(coins);
        const [bump, setBump] = useState(0);
        const prev = useRef(coins);
        useEffect(() => {
          const from = prev.current;
          prev.current = coins;
          if (coins > from) setBump((b) => b + 1);
          const start = performance.now();
          let raf = 0;
          const step = () => {
            const k = Math.min(1, (performance.now() - start) / 500);
            setShown(Math.round(from + (coins - from) * (1 - Math.pow(1 - k, 3))));
            if (k < 1) raf = requestAnimationFrame(step);
          };
          step();
          return () => cancelAnimationFrame(raf);
        }, [coins]);
        return h(
          "div",
          {
            key: bump,
            className: cn(
              "flex items-center gap-1.5 rounded-full border-[3px] border-[#0b2546] bg-gradient-to-b from-[#24609f] to-[#123764] py-0.5 pl-1 pr-3 shadow-lg sm:gap-2 sm:border-4 sm:py-1 sm:pr-4",

          },
          h(Coin, { size: 24 }),
          h("span", { className: "txt-o text-base font-extrabold tabular-nums text-[#ffe066] sm:text-xl" }, fmtNum(shown))
        );
      }

        const islands = useGame((s) => s.islands);
        const moonUnlocked = islands.includes("lunar_crater");
        const npcLabel =
          nearNpc === "merchant"
            ? "💰 " + t("talkMerchant")
            : nearNpc === "shop"
              ? "🎣 " + t("talkShop")
              : nearNpc === "rocket"
                ? `🚀 ${t("talkRocket")}${moonUnlocked ? "" : ` (${fmtNum(ROCKET_LAUNCH_COST)} 🪙)`}`
                : nearNpc === "earth_rocket"
                  ? "🌍 " + t("talkEarthRocket")
                  : nearNpc === "boat"
                    ? "⛵ " + t("talkBoat")
                    : "";
        return h(
          "div",
          { className: "pointer-events-none absolute bottom-2.5 right-2.5 z-20 flex items-end gap-2 sm:bottom-5 sm:right-5" },
          nearNpc &&
            phase === "idle" &&
            h(
              "button",
              {
                className: cn(
                  "btn btn-yellow anim-pop pointer-events-auto mb-1",
                  isMobile ? "px-3 py-2 text-xs" : "px-4 py-2.5 text-sm sm:text-base"
                ),
                onClick: () => runtime.engine?.interact(),
              },
              npcLabel,
              !isMobile && h("kbd", { className: "ml-1 rounded bg-black/20 px-1.5 text-xs" }, "E")
            ),
          h(
            "div",
            { className: "pointer-events-auto flex flex-col items-end gap-1.5" },
            h(
              "button",
              {
                className: cn(
                  "btn rounded-full",
                  isMobile ? "px-2.5 py-1 text-[11px]" : "px-3 py-1.5 text-xs sm:text-sm",
                  avail ? (autoOn ? "btn-green" : "btn-gray") : "btn-purple"
                ),
                onClick: () => {
                  if (!avail) {
                    openPanel("shop", "boosts");
                    return;
                  }
                  audio.play("click");
                  useGame.setState({ autoOn: !autoOn });
                },
              },
              `🤖 ${t("auto")} ${avail ? (autoOn ? "ON" : "OFF") : "🔒"}`
            ),
            h(
              "button",
              {
                className: cn(
                  "btn flex-col gap-0 rounded-full text-white shadow-2xl",
                  isMobile
                    ? "h-[74px] w-[74px] border-b-[5px]"
                    : "h-[86px] w-[86px] border-b-[6px] sm:h-[100px] sm:w-[100px]",
                  hot ? "border-[#9a1f1f] bg-gradient-to-b from-[#ff8a5a] to-[#e2333b]" : "border-[#b9700c] bg-gradient-to-b from-[#ffe066] to-[#f5a623]",
                  phase === "bite" && "anim-shake"
                ),
                onPointerDown: (e) => {
                  e.preventDefault();
                  e.currentTarget.setPointerCapture?.(e.pointerId);
                  runtime.engine?.press();
                },
                onPointerUp: () => runtime.engine?.release(),
                onPointerCancel: () => runtime.engine?.release(),
                onContextMenu: (e) => e.preventDefault(),
              },
              h("span", { className: isMobile ? "text-3xl leading-none drop-shadow" : "text-4xl leading-none drop-shadow sm:text-[42px]" }, ic),
              h("span", { className: cn("txt-o mt-0.5 font-extrabold uppercase", isMobile ? "text-[10px]" : "text-xs sm:text-sm", hot ? "text-white" : "text-[#4a2a00] [text-shadow:none]") }, lb)
            )
          )
        );
      }

      function Joystick() {
        const phase = useGame((s) => s.phase);
        const panel = useGame((s) => s.panel);
        const baseRef = useRef(null);
        const knobRef = useRef(null);
        const st = useRef(null);
        const [pos, setPos] = useState(null);
        const hidden = !!panel || !(phase === "idle" || phase === "waiting" || phase === "reelback");
        useEffect(() => {
          if (hidden) {
            st.current = null;
            setPos(null);
            runtime.engine?.setJoy(0, 0);
          }
        }, [hidden]);
        if (hidden) return null;
        const R = 42;
        const move = (x, y) => {
          const s = st.current;
          if (!s) return;
          let dx = x - s.cx, dy = y - s.cy;
          const d = Math.hypot(dx, dy);
          if (d > R) {
            dx = (dx / d) * R;
            dy = (dy / d) * R;
          }
          if (knobRef.current) knobRef.current.style.transform = `translate(${dx}px, ${dy}px)`;
          runtime.engine?.setJoy(dx / R, -dy / R);
        };
        const end = () => {
          st.current = null;
          setPos(null);
          runtime.engine?.setJoy(0, 0);
        };
        return h(
          "div",
          {
            className: "absolute bottom-0 left-0 z-[15] h-[54%] w-[44%]",
            onPointerDown: (e) => {
              e.preventDefault();
              e.currentTarget.setPointerCapture?.(e.pointerId);
              const rect = e.currentTarget.getBoundingClientRect();
              st.current = { id: e.pointerId, cx: e.clientX, cy: e.clientY };
              setPos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            },
            onPointerMove: (e) => st.current?.id === e.pointerId && move(e.clientX, e.clientY),
            onPointerUp: end,
            onPointerCancel: end,
          },
          h(
            "div",
            {
              ref: baseRef,
              className: cn("absolute h-[96px] w-[96px] -translate-x-1/2 -translate-y-1/2 rounded-full border-[3px] border-white/40 bg-black/25 transition-opacity", pos ? "opacity-100" : "opacity-65"),
              style: pos ? { left: pos.x, top: pos.y } : { left: 72, bottom: -26 },
            },
            h("div", { ref: knobRef, className: "absolute left-1/2 top-1/2 -ml-[22px] -mt-[22px] h-11 w-11 rounded-full border-[3px] border-white/75 bg-white/50 shadow-lg" })
          )
        );
      }

      function Hint() {
        const phase = useGame((s) => s.phase);
        const caught = useGame((s) => s.stats.caught);
        const earned = useGame((s) => s.stats.earned);
        const bagLen = useGame((s) => s.bag.length);
        const lvl = useGame((s) => s.bagLevel);
        const isMobile = useGame((s) => s.isMobile);
        let text = "";
        if (phase === "idle") {
          if (bagLen >= bagCapacity(lvl)) text = t("bagFull") + " 🎒";
          else if (caught === 0) text = t("hintFirstCast");
          else if (bagLen >= 8 && earned === 0) text = t("hintSell");
        } else if (phase === "waiting") text = t("hintWait");
        if (!text && !(phase === "idle" && caught < 2 && !isMobile)) return null;
        return h(
          "div",
          { className: "pointer-events-none absolute bottom-[132px] left-1/2 z-20 w-[min(92vw,560px)] -translate-x-1/2 text-center sm:bottom-6" },
          text && h("div", { className: "txt-o inline-block rounded-2xl bg-black/35 px-4 py-2 text-sm font-extrabold text-white sm:text-base" }, text),
          phase === "idle" && caught < 2 && !isMobile && h("div", { className: "txt-o mt-1 text-xs font-bold text-white/85" }, t("hintDesktop"))
        );
      }

      function Toasts() {
        const toasts = useGame((s) => s.toasts);
        return h(
          "div",
          { className: "pointer-events-none absolute left-1/2 top-[96px] z-30 flex w-[min(92vw,420px)] -translate-x-1/2 flex-col items-center gap-1.5 sm:top-[72px]" },
          toasts.map((x) =>
            h(
              "div",
              {
                key: x.id,
                className: "anim-drop txt-o rounded-full border-2 border-white/20 bg-[#0b2546]/85 px-4 py-1.5 text-center text-sm font-extrabold shadow-lg",
                style: { color: x.color ?? "#ffffff" },
              },
              x.text
            )
          )
        );
      }

      function HUD() {
        const isMobile = useGame((s) => s.isMobile);
        const panel = useGame((s) => s.panel);
        const phase = useGame((s) => s.phase);
        const busy = phase === "bite" || phase === "reeling" || phase === "charging";
        return h(
          React.Fragment,
          null,
          h(TapOverlay),
          h(TopBar),
          !busy && !panel && h(SideButtons),
          !panel && h(ActionCluster),
          isMobile && h(Joystick),
          h(ChargeMeter),
          h(Minigame),
          h(BitePrompt),
          h(CastLabel),
          h(CatchPopup),
          !panel && h(Hint),
          h(Toasts),
          h(Panels)
        );
      }

      function GameCanvas() {
        const ref = useRef(null);
        const saveLoaded = useGame((s) => s.saveLoaded);
        const [error, setError] = useState(false);
        useEffect(() => {
          if (!saveLoaded || !ref.current) return;
          let engine = null;
          try {
            engine = new Engine(ref.current, useGame.getState().isMobile);
            runtime.engine = engine;
          } catch (e) {
            console.error(e);
            setError(true);
            useGame.setState({ engineReady: true });
          }
          return () => {
            engine?.dispose();
            runtime.engine = null;
          };
        }, [saveLoaded]);
        return h(
          React.Fragment,
          null,
          h("div", { ref, className: "absolute inset-0 z-0" }),
          // Пункт 1.6.1.7: Никаких упоминаний WebGL при ошибке инициализации
          error &&
            h(
              "div",
              { className: "absolute inset-0 z-50 flex items-center justify-center bg-[#0e3a66] p-6 text-center text-lg font-bold text-white" },
              "Не удалось запустить 3D-сцену на этом устройстве 😢"
            )
        );
      }

      function StartScreen() {
        const ready = useGame((s) => s.engineReady);
        const isMobile = useGame((s) => s.isMobile);
        const caught = useGame((s) => s.stats.caught);
        const showcase = ["clown", "goldcarp", "aurora", "nebulajelly", "skyserpent", "infinityfish"];
        return h(
          "div",
          { className: "absolute inset-0 z-30 flex flex-col items-center justify-center bg-gradient-to-b from-[#04142a]/30 via-transparent to-[#04142a]/70 p-4" },
          h(
            "div",
            { className: "anim-drop text-center" },
            h("div", { className: "anim-bob mb-1 text-6xl sm:text-7xl" }, "🎣"),
            h("h1", { className: "txt-o2 text-5xl font-extrabold leading-none tracking-tight text-[#ffe066] sm:text-7xl" }, t("title")),
            h("div", { className: "txt-o2 mt-2 text-2xl font-extrabold text-white sm:text-3xl" }, t("subtitle"))
          ),
          h(
            "div",
            { className: "mt-6 flex items-end justify-center gap-1 sm:gap-3" },
            showcase.map((id, i) =>
              h(
                "div",
                { key: id, className: "anim-bob", style: { animationDelay: `${i * 0.25}s` } },
                h(FishIcon, { def: FISH_MAP[id], className: "h-10 w-16 sm:h-14 sm:w-24" })
              )
            )
          ),
          h(
            "div",
            { className: "mt-8 h-24" },
            ready
              ? h("button", { className: "btn btn-green anim-pulse px-12 py-4 text-3xl", onClick: startGame }, `▶ ${t("play")}`)
              : h(
                  "div",
                  { className: "flex w-64 flex-col items-center gap-2" },
                  h("div", { className: "txt-o font-extrabold text-white" }, t("loading")),
                  h(
                    "div",
                    { className: "h-4 w-full overflow-hidden rounded-full border-2 border-[#0b2546] bg-black/30" },
                    h("div", { className: "h-full w-2/3 animate-pulse rounded-full bg-gradient-to-r from-[#ffe066] to-[#f5a623]" })
                  )
                )
          ),
          h(
            "div",
            { className: "txt-o absolute bottom-4 left-0 right-0 px-4 text-center text-xs font-bold text-white/90 sm:text-sm" },
            isMobile ? t("hintMobile") : t("hintDesktop"),
            caught > 0 && h("div", { className: "mt-1 text-[#ffe066]" }, `🐟 × ${caught}`)
          )
        );
      }

      function Overlays() {
        const fade = useGame((s) => s.fade);
        const island = useGame((s) => s.island);
        const isSpace = island === "spaceport" || (ISLAND_MAP[island]?.planet ?? 1) === 2;
        return h(
          "div",
          {
            className: `pointer-events-none absolute inset-0 z-50 flex items-center justify-center bg-[#04142a] transition-opacity duration-500 ${fade ? "opacity-100" : "opacity-0"}`,
          },
          fade && h("div", { className: "anim-bob text-7xl" }, isSpace ? "🚀" : "⛵")
        );
      }

      function App() {
        const started = useGame((s) => s.started);
        const lang = useGame((s) => s.curLang);
        useEffect(() => {
          void boot();
        }, []);
        return h(
          "div",
          {
            className: "game-root fixed inset-0 overflow-hidden bg-[#0e3a66]",
            onContextMenu: (e) => e.preventDefault(),
          },
          h(GameCanvas),
          started ? h(HUD, { key: lang }) : h(StartScreen, { key: lang }),
          h(Overlays)
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
